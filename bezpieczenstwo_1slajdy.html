<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bezpieczeństwo w sieci — aktywna wersja dla ucznia</title>
  <style>
    :root{
      --bg1:#0b1020; --bg2:#162a5e; --card:rgba(255,255,255,.10); --card2:rgba(255,255,255,.07);
      --border:rgba(255,255,255,.20); --text:#fff; --muted:rgba(255,255,255,.78); --good:#5eead4;
      --warn:#fbbf24; --bad:#fb7185; --shadow:0 22px 60px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);
      background:radial-gradient(900px 600px at 15% 10%, rgba(122,162,255,.32), transparent 60%),
                 radial-gradient(900px 600px at 90% 15%, rgba(94,234,212,.18), transparent 58%),
                 linear-gradient(180deg,var(--bg2),var(--bg1)); overflow:hidden}
    .app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}
    header{padding:16px 18px 8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
      background:rgba(255,255,255,.14);border:1px solid var(--border);font-size:24px;box-shadow:var(--shadow)}
    h1{margin:0;font-size:clamp(18px,2.8vw,26px)} .sub{margin:3px 0 0;color:var(--muted);font-weight:800;font-size:13px}
    .topBtns,.nav{display:flex;gap:10px;flex-wrap:wrap}
    .btn{border:1px solid var(--border);background:rgba(255,255,255,.12);color:#fff;padding:10px 13px;border-radius:14px;cursor:pointer;font-weight:900}
    .btn:hover{background:rgba(255,255,255,.20)} .btn:disabled{opacity:.55;cursor:not-allowed}
    .scoreBar{padding:0 18px 8px;display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:10px}
    .pill{border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.09);padding:10px 12px;font-weight:900}
    .stage{padding:6px 18px 0;display:grid;place-items:center}
    .slide{width:min(1050px,100%);min-height:min(600px,calc(100vh - 210px));background:linear-gradient(180deg,var(--card),var(--card2));
      border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);padding:18px;overflow:auto}
    .kicker{display:inline-flex;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.08);font-size:13px;font-weight:1000;color:var(--muted)}
    .bigTitle{margin:12px 0 6px;font-size:clamp(25px,4vw,40px);line-height:1.05}
    .subtitle{margin:0 0 14px;color:var(--muted);font-size:clamp(14px,1.8vw,17px);font-weight:700;max-width:70ch}
    .content{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--border);border-radius:20px;background:rgba(255,255,255,.08);padding:14px}
    .card h3{margin:0 0 10px;font-size:18px;display:flex;gap:10px;align-items:center}.emoji{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid var(--border);font-size:22px}
    .bullets{margin:0;padding-left:20px;font-size:17px;line-height:1.3;font-weight:780}.bullets li{margin:8px 0}
    .choices,.missionBtns,.memoryGrid{display:grid;gap:10px}.choice,.missionBtn,.memoryCard{border:1px solid var(--border);background:rgba(255,255,255,.10);color:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;font-weight:900;text-align:left}
    .choice:hover,.missionBtn:hover,.memoryCard:hover{background:rgba(255,255,255,.18)}
    .choice.done,.missionBtn.done{opacity:.75}.feedback{margin-top:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--border);display:none;font-weight:900}
    .good{background:rgba(94,234,212,.14)} .bad{background:rgba(251,113,133,.14)} .warn{background:rgba(251,191,36,.16)}
    .badgeWrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{padding:7px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.08);font-size:13px;font-weight:1000}
    .missionBox{display:grid;gap:12px}.missionStatus{font-size:14px;color:var(--muted);font-weight:900}
    .memoryGrid{grid-template-columns:repeat(2,1fr)} .memoryCard{min-height:72px;display:grid;place-items:center;font-size:17px}
    .memoryCard.revealed{background:rgba(94,234,212,.18)} .memoryCard.matched{background:rgba(94,234,212,.28);cursor:default}
    .dots{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.dot{width:12px;height:12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--border);cursor:pointer}.dot.active{background:#fff}
    footer{padding:12px 18px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .hint{color:var(--muted);font-size:13px;font-weight:800}
    
    .bigAction{padding:16px 20px;border-radius:18px;font-size:20px;font-weight:1000}
    .scratchMini{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.10);border:1px solid var(--border);font-weight:900}
    .overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.72);
      display:none; place-items:center; padding:18px; z-index:50;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .modal{
      width:min(860px,100%); max-height:90vh; overflow:hidden;
      border-radius:24px; background:#f8fbff; color:#123;
      border:1px solid rgba(255,255,255,.25); box-shadow:0 24px 80px rgba(0,0,0,.48);
      display:flex; flex-direction:column;
    }
    .modalTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:18px 18px 10px}
    .modalBody{padding:0 18px 16px;overflow:auto}
    .modalTitle{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.1;color:#123}
    .modalSub{margin:6px 0 0;color:#456;font-size:14px;font-weight:900}
    .closeBtn{border:1px solid #d7e6f7;background:#fff;color:#123;padding:10px 12px;border-radius:14px;cursor:pointer;font-weight:1000}
    .scratchGoal,.scratchShow{
      margin-top:12px; border-radius:18px; padding:14px 16px; border:2px solid #cfe2ff; background:#eef6ff; color:#123;
    }
    .scratchBlocks{
      margin-top:12px; border-radius:18px; padding:14px 16px; border:2px solid #f0cf62; background:#fff7cc; color:#3b2f00;
    }
    .scratchGoal strong,.scratchBlocks strong,.scratchShow strong{
      display:block; margin-bottom:8px; font-size:18px;
    }
    .scratchBlocks ul{margin:0;padding-left:22px;color:#3b2f00;font-size:17px;line-height:1.35;font-weight:800}
    .scratchGoal p,.scratchShow p{margin:0;font-size:17px;line-height:1.35;font-weight:800}

    @media (max-width: 860px){.content,.scoreBar{grid-template-columns:1fr}.slide{min-height:min(600px,calc(100vh - 250px))}.memoryGrid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🛡️</div>
      <div>
        <h1 id="headerTitle">Bezpieczeństwo w sieci — aktywny uczeń</h1>
        <div class="sub">Punkty • odznaki • misje • decyzje</div>
      </div>
    </div>
    <div class="topBtns">
      <button class="btn" id="resetAll">⟲ Reset gry</button>
      <button class="btn" id="fullscreenBtn">⛶ Pełny ekran</button>
    </div>
  </header>

  <section class="scoreBar">
    <div class="pill">⭐ Punkty: <span id="points">0</span></div>
    <div class="pill">🏅 Odznaki: <span id="badgesCount">0</span></div>
    <div class="pill">🎯 Ukończone misje: <span id="missionsCount">0</span>/7</div>
  </section>

  <main class="stage"><section class="slide" id="slide"></section></main>

  <footer>
    <div class="nav">
      <button class="btn" id="prev">← Wstecz</button>
      <button class="btn" id="next">Dalej →</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="hint">Tu dziecko może się wykazać: wyborem, uzasadnieniem, pamięcią i refleksem.</div>
  </footer>
</div>

<div class="overlay" id="scratchOverlay" role="dialog" aria-modal="true" aria-label="Wylosowane zadanie Scratch">
  <div class="modal">
    <div class="modalTop">
      <div>
        <h3 class="modalTitle" id="scratchTaskTitle">Zadanie Scratch</h3>
        <div class="modalSub">Losowanie zadania dla ucznia</div>
      </div>
      <button class="closeBtn" id="scratchClose">✕ Zamknij</button>
    </div>
    <div class="modalBody" id="scratchModalBody"></div>
  </div>
</div>

<script>
const scratchTasks = [
  {title:'Animowane przywitanie', goal:'Sekwencja zdarzeń i prosta animacja.', blocks:['kiedy kliknięto zieloną flagę','powiedz … przez … sek.','czekaj … sek.','idź do x: y:','pokaż / ukryj'], show:'estetyką animacji i kolejnością działań'},
  {title:'Duszek sterowany strzałkami', goal:'Sterowanie z klawiatury.', blocks:['zawsze','jeżeli … to','klawisz … naciśnięty?','zmień x o …','zmień y o …'], show:'płynnością sterowania'},
  {title:'Odbijająca się piłka', goal:'Ruch automatyczny.', blocks:['idź … kroków','jeżeli na krawędzi, odbij się','ustaw kierunek na …','zawsze'], show:'dobraniem prędkości i kierunku'},
  {title:'Labirynt', goal:'Wykrywanie koloru i cofanie po błędzie.', blocks:['dotyka koloru …?','jeżeli … to','idź do x: y:','sterowanie klawiszami','tło jako labirynt'], show:'pomysłowym układem planszy'},
  {title:'Quiz z 5 pytaniami', goal:'Dane od użytkownika i warunki.', blocks:['zapytaj … i czekaj','odpowiedź','jeżeli … to / w przeciwnym razie','zmienna „punkty”'], show:'poprawnym liczeniem punktów'},
  {title:'Kalkulator dodawania', goal:'Operacje na danych.', blocks:['zapytaj … i czekaj','zmienne','ustaw [zmienna] na …','operator +','powiedz …'], show:'poprawnym pobieraniem i wykorzystaniem danych'},
  {title:'Losowanie liczby i zgadywanie', goal:'Losowość i pętla do skutku.', blocks:['ustaw [liczba] na losuj od … do …','powtarzaj aż','zapytaj … i czekaj','porównania =, <, >'], show:'logiką podpowiedzi „za mało / za dużo”'},
  {title:'Licznik czasu 10 sekund', goal:'Pętla z licznikiem.', blocks:['zmienna „czas”','powtarzaj','zmień [czas] o -1','czekaj 1 sek.','jeżeli … to'], show:'czytelnym przebiegiem odliczania'},
  {title:'Instrument muzyczny', goal:'Dźwięk i interakcja.', blocks:['kiedy klawisz … naciśnięty','zagraj dźwięk …','lub zagraj nutę … przez … taktów'], show:'doborem dźwięków i układem instrumentu'},
  {title:'Taniec z przebieraniem', goal:'Kostiumy i rytm.', blocks:['następny kostium','powtarzaj','obrót o … stopni','czekaj … sek.','dźwięk lub muzyka'], show:'synchronizacją ruchów'},
  {title:'Klikacz punktów', goal:'Obsługa myszy i punktacja.', blocks:['kiedy ten duszek kliknięty','zmienna „punkty”','zmień [punkty] o 1','idź do losowego położenia'], show:'dynamiką gry'},
  {title:'Gra „łap spadające przedmioty”', goal:'Współpraca dwóch duszków i wykrywanie dotknięcia.', blocks:['dotyka [koszyk]?','powtarzaj aż','zmień y o …','idź do losowego położenia','zmienna „wynik”'], show:'działaniem gry i tempem rozgrywki'},
  {title:'Historyjka z komunikatami', goal:'Współpraca między duszkami.', blocks:['nadaj komunikat …','kiedy otrzymam …','powiedz …','czekaj … sek.'], show:'dobrą synchronizacją scenki'},
  {title:'Rysowanie figur', goal:'Użycie rozszerzenia Pisak.', blocks:['przyłóż pisak','podnieś pisak','powtórz','idź … kroków','obróć o … stopni'], show:'dokładnością rysunku'},
  {title:'Symulator sygnalizacji świetlnej', goal:'Zmiany stanu i logika sekwencji.', blocks:['następne tło albo kostiumy','czekaj … sek.','zawsze','ukryj/pokaż'], show:'poprawną kolejnością sygnałów'},
  {title:'Prosta gra z życiami', goal:'Kilka zmiennych i warunek przegranej.', blocks:['zmienna „życia”','jeżeli dotyka … to','zmień [życia] o -1','jeżeli [życia = 0] to','zatrzymaj wszystko'], show:'logiką zakończenia gry'},
  {title:'Generator śmiesznych zdań', goal:'Listy lub losowanie z przygotowanych zestawów.', blocks:['listy lub zmienne','losuj od … do …','połącz … z …','powiedz …'], show:'kreatywnością i poprawnym łączeniem tekstu'},
  {title:'Teleporty na planszy', goal:'Wiele warunków i koordynaty.', blocks:['jeżeli dotyka koloru … to','idź do x: y:','sterowanie klawiszami','zawsze'], show:'zaprojektowaniem działania teleportów'},
  {title:'Reakcja na głośność lub mikrofon', goal:'Wykorzystanie czujników.', blocks:['głośność','jeżeli … to','zmień rozmiar o … lub zmień y o …'], show:'ciekawym wykorzystaniem wejścia z otoczenia'},
  {title:'Mini-gra z poziomami', goal:'Przejście do kolejnego etapu.', blocks:['zmienna „poziom”','jeżeli [punkty > …] to','następne tło','zwiększanie szybkości / trudności'], show:'stworzeniem progresji w grze'}
];
let lastScratchTask = null;
function openScratchTask(){
  const task = scratchTasks[Math.floor(Math.random()*scratchTasks.length)];
  lastScratchTask = task;
  const title = document.getElementById('scratchTaskTitle');
  const body = document.getElementById('scratchModalBody');
  title.textContent = '🎲 ' + task.title;
  body.innerHTML = `
    <div class="scratchGoal"><strong>Cel</strong><p>${task.goal}</p></div>
    <div class="scratchBlocks"><strong>Musi użyć bloczków</strong><ul>${task.blocks.map(b=>`<li>${b}</li>`).join('')}</ul></div>
    <div class="scratchShow"><strong>Na czym ma się wykazać</strong><p>${task.show}</p></div>
  `;
  const mini = document.getElementById('scratchLastTask');
  if(mini) mini.textContent = 'Ostatnio wylosowano: ' + task.title;
  document.getElementById('scratchOverlay').style.display = 'grid';
}
function closeScratchTask(){
  document.getElementById('scratchOverlay').style.display = 'none';
}

const slides = [
  {
    kicker:'START', title:'Misja: zostań Cyberbohaterem', emoji:'🦸',
    subtitle:'Na każdej planszy uczeń coś robi: wybiera, zgaduje, reaguje albo zdobywa odznakę.',
    leftTitle:'Jak zdobywasz punkty?', bullets:['Dobra decyzja = +1 punkt','Ukończona misja = +1 punkt','Nowa odznaka = powód do dumy'],
    type:'intro'
  },
  {
    kicker:'MISJA 1', title:'Dane osobowe', emoji:'🧾',
    subtitle:'Wskaż, czego NIE powinno się podawać obcej osobie w sieci.',
    leftTitle:'Szybka podpowiedź', bullets:['Adres domu','Numer telefonu','Hasło','Szkoła i klasa'],
    type:'choices', badge:'Strażnik Danych',
    question:'Która odpowiedź jest najlepsza?',
    options:[
      {text:'Podam adres, jeśli ktoś obieca prezent.', correct:false, explain:'Nie. Adres to dana osobowa.'},
      {text:'Nie podam adresu ani telefonu.', correct:true, explain:'Tak. Dane osobowe chronimy.'},
      {text:'Podam hasło, jeśli ktoś napisze miło.', correct:false, explain:'Nie. Hasło jest tajne.'}
    ]
  },
  {
    kicker:'MISJA 2', title:'Podejrzany link', emoji:'🖱️',
    subtitle:'Tu liczy się refleks i myślenie. Wybierz najlepszą reakcję.',
    leftTitle:'Sygnały alarmowe', bullets:['„Kliknij szybko!”','„Wygrałeś nagrodę!”','„Konto zaraz zniknie!”'],
    type:'choices', badge:'Łowca Pułapek',
    question:'Dostajesz komunikat: „Kliknij teraz i odbierz nagrodę!”. Co robisz?',
    options:[
      {text:'Klikam, bo może naprawdę wygrałem.', correct:false, explain:'To częsta pułapka.'},
      {text:'Zamykam i pytam dorosłego.', correct:true, explain:'Brawo. Najpierw bezpieczeństwo.'},
      {text:'Wysyłam dalej kolegom.', correct:false, explain:'Nie. Nie rozsyłamy pułapek.'}
    ]
  },
  {
    kicker:'MISJA 3', title:'Jak odpowiesz?', emoji:'💬',
    subtitle:'Uczeń może się wykazać dobrą reakcją na trudną sytuację.',
    leftTitle:'Scenka', bullets:['Ktoś obcy prosi o zdjęcie','Ktoś chce numer telefonu','Ktoś pisze niemiło'],
    type:'mission', badge:'Mistrz Reakcji'
  },
  {
    kicker:'MISJA 4', title:'Memory bezpieczeństwa', emoji:'🧠',
    subtitle:'Połącz w pary zasadę i działanie.',
    leftTitle:'Znajdź pary', bullets:['Hasło ↔ nie podaję','Zdjęcie ↔ pytam o zgodę','Strach ↔ mówię dorosłemu','Złość ↔ robię przerwę'],
    type:'memory', badge:'Mistrz Pamięci'
  },
  {
    kicker:'MISJA 5', title:'Prawda czy pułapka?', emoji:'🎲',
    subtitle:'Tu dziecko pokazuje, że potrafi odróżnić dobrą radę od złej.',
    leftTitle:'Zagadka', bullets:['Jedna odpowiedź jest dobra','Dwie to internetowe pułapki'],
    type:'choices', badge:'Detektyw Sieci',
    question:'Które zdanie jest najlepszą radą?',
    options:[
      {text:'Podaj hasło najlepszemu koledze.', correct:false, explain:'Nie. Hasło jest tajne.'},
      {text:'Gdy nie wiesz, pytaj dorosłego.', correct:true, explain:'Tak. To bardzo dobra zasada.'},
      {text:'Klikaj szybko, żeby nie stracić okazji.', correct:false, explain:'Nie. Pośpiech to znak pułapki.'}
    ]
  },
  {
    kicker:'MISJA 6', title:'Odznaka eksperta', emoji:'🏅',
    subtitle:'Uczeń dostaje krótkie zagadki na myślenie i może sam podać odpowiedź ustnie.',
    leftTitle:'Pytania dla eksperta', bullets:['Co zrobisz, gdy ktoś obcy chce twoje hasło?','Dlaczego trzeba pytać o zgodę na zdjęcie?','Co jest lepsze: szybkie kliknięcie czy spokojne myślenie?'],
    type:'expert', badge:'Ekspert Bezpieczeństwa'
  },
  {
    kicker:'BONUS KOŃCOWY', title:'Losowanie zadania Scratch', emoji:'🎲',
    subtitle:'Na końcu można wylosować zadanie do Scratcha i przejść dalej do AI albo Scratcha.',
    leftTitle:'Co tu można zrobić?', bullets:['Wylosować zadanie Scratch','Zobaczyć je w pop-upie','Przejść do AI','Przejść do Scratcha'],
    type:'scratch_final'
  },
  {
    kicker:'FINAŁ', title:'Wynik Cyberbohatera', emoji:'⭐',
    subtitle:'Na końcu uczeń widzi swój wynik i odznaki. Można zrobić klasowe podsumowanie.',
    leftTitle:'Kodeks końcowy', bullets:['STOP','POMYŚL','ZAPYTAJ DOROSŁEGO'],
    type:'summary'
  }
];

let idx = 0;
let points = 0;
let badges = [];
let missionsDone = new Set();
let answered = {};
let memoryState = { open: [], matched: [] };

const slideEl = document.getElementById('slide');
const pointsEl = document.getElementById('points');
const badgesCountEl = document.getElementById('badgesCount');
const missionsCountEl = document.getElementById('missionsCount');
const dotsEl = document.getElementById('dots');

function updateTop(){
  pointsEl.textContent = points;
  badgesCountEl.textContent = badges.length;
  missionsCountEl.textContent = missionsDone.size;
}
function addPoint(n=1){ points += n; updateTop(); }
function addBadge(name){ if(!badges.includes(name)){ badges.push(name); addPoint(1); updateTop(); } }
function markMission(i){ if(!missionsDone.has(i)){ missionsDone.add(i); addPoint(1); updateTop(); } }
function escapeHtml(s){ return s.replace(/[&<>\"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }

function renderDots(){
  dotsEl.innerHTML='';
  slides.forEach((_,i)=>{
    const d=document.createElement('div'); d.className='dot'+(i===idx?' active':''); d.onclick=()=>{idx=i;render()}; dotsEl.appendChild(d);
  });
}

function badgeList(){
  return badges.length ? `<div class="badgeWrap">${badges.map(b=>`<span class="badge">🏅 ${b}</span>`).join('')}</div>` : `<div class="badgeWrap"><span class="badge">Jeszcze bez odznaki — zaraz coś zdobędziesz!</span></div>`;
}

function renderChoices(slide, i){
  return `
    <div class="card">
      <h3><span class="emoji">🤔</span>${slide.question}</h3>
      <div class="choices">
        ${slide.options.map((o,oi)=>`<button class="choice ${answered[i] ? 'done':''}" data-opt="${oi}" ${answered[i] ? 'disabled':''}>${o.text}</button>`).join('')}
      </div>
      <div class="feedback" id="feedbackBox"></div>
      <div class="badgeWrap"><span class="badge">Pokaż, że umiesz wybrać najlepiej</span></div>
    </div>`;
}

function renderMission(){
  return `
  <div class="card">
    <h3><span class="emoji">🎭</span>Wybierz najlepszą odpowiedź</h3>
    <div class="missionBox">
      <div class="missionStatus">Sytuacja: obca osoba pisze: „Wyślij numer telefonu i zdjęcie”.</div>
      <div class="missionBtns">
        <button class="missionBtn" data-m="0">„Dobrze, już wysyłam.”</button>
        <button class="missionBtn" data-m="1">„Nie podaję takich rzeczy.”</button>
        <button class="missionBtn" data-m="2">„Zapytam dorosłego i nic nie wyślę.”</button>
      </div>
      <div class="feedback" id="missionFeedback"></div>
      <div class="badgeWrap"><span class="badge">Tu uczeń może uzasadnić swoją decyzję ustnie</span></div>
    </div>
  </div>`;
}

const memoryCards = [
  {id:'haslo', text:'Hasło'}, {id:'haslo', text:'nie podaję'},
  {id:'zdjecie', text:'Zdjęcie'}, {id:'zdjecie', text:'pytam o zgodę'},
  {id:'strach', text:'Strach'}, {id:'strach', text:'mówię dorosłemu'},
  {id:'zlosc', text:'Złość'}, {id:'zlosc', text:'robię przerwę'}
];
let shuffledMemory = [...memoryCards].sort(()=>Math.random()-0.5);

function renderMemory(){
  return `
  <div class="card">
    <h3><span class="emoji">🧠</span>Znajdź pary</h3>
    <div class="memoryGrid">
      ${shuffledMemory.map((c,idxCard)=>{
        const revealed = memoryState.open.includes(idxCard) || memoryState.matched.includes(idxCard);
        const matched = memoryState.matched.includes(idxCard);
        return `<button class="memoryCard ${revealed?'revealed':''} ${matched?'matched':''}" data-card="${idxCard}" ${matched?'disabled':''}>${revealed ? c.text : '❓'}</button>`;
      }).join('')}
    </div>
    <div class="feedback warn" style="display:block;margin-top:12px">Po znalezieniu wszystkich par uczeń zdobywa odznakę.</div>
  </div>`;
}

function renderExpert(){
  const riddles = [
    'Co jest cenniejsze niż nagroda z reklamy i nie powinno trafić do obcych?',
    'Jakie jedno słowo powinno się pojawić przed wrzuceniem czyjegoś zdjęcia?',
    'Kto częściej wygrywa z pułapką: ten, kto klika szybko, czy ten, kto myśli spokojnie?'
  ];
  return `
  <div class="card">
    <h3><span class="emoji">🧩</span>Zagadki na myślenie</h3>
    <ul class="bullets">${riddles.map(r=>`<li>${r}</li>`).join('')}</ul>
    <div class="badgeWrap"><span class="badge">Uczeń odpowiada ustnie i klasa ocenia 👍</span></div>
    <button class="btn" id="expertDone">Przyznaj odznakę eksperta</button>
  </div>`;
}


function renderScratchFinal(){
  return `
  <div class="card">
    <h3><span class="emoji">🎮</span>Wylosuj zadanie i wybierz dalszą drogę</h3>
    <div class="bullets" style="padding-left:20px">
      <li>Kliknij i wylosuj zadanie do Scratcha</li>
      <li>Zadanie pokaże się w wygodnym oknie pop-up</li>
      <li>Potem możesz przejść do AI albo do Scratcha</li>
    </div>
    <div style="margin-top:14px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn bigAction" id="drawScratch">🎲 Wylosuj zadanie Scratch</button>
      <button class="btn bigAction" id="goAiFinal">➡️ Przejdź do AI</button>
      <button class="btn bigAction" id="goScratchFinal">🟧 Przejdź do Scratcha</button>
    </div>
    <div class="scratchMini" id="scratchLastTask">Jeszcze nic nie wylosowano.</div>
  </div>`;
}

function renderSummary(){
  const title = points >= 10 ? 'Super Cyberbohater!' : points >= 6 ? 'Dobry Strażnik Sieci!' : 'Młody Odkrywca Bezpieczeństwa!';
  return `
  <div class="card">
    <h3><span class="emoji">🏁</span>${title}</h3>
    <div class="bullets" style="padding-left:20px">
      <li>Zdobyte punkty: ${points}</li>
      <li>Odznaki: ${badges.length}</li>
      <li>Ukończone misje: ${missionsDone.size}/6</li>
    </div>
    ${badgeList()}
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="goAi">➡️ Przejdź do strony AI</button>
    </div>
  </div>`;
}

function render(){
  const s = slides[idx];
  document.getElementById('headerTitle').textContent = `Bezpieczeństwo w sieci — slajd ${idx+1}/${slides.length}`;

  let right = '';
  if(s.type==='intro') right = `<div class="card"><h3><span class="emoji">🎯</span>Co tu działa?</h3><ul class="bullets"><li>Uczeń wybiera odpowiedź</li><li>Zdobywa punkty i odznaki</li><li>Może uzasadnić decyzję przed klasą</li></ul>${badgeList()}</div>`;
  if(s.type==='choices') right = renderChoices(s, idx);
  if(s.type==='mission') right = renderMission();
  if(s.type==='memory') right = renderMemory();
  if(s.type==='expert') right = renderExpert();
  if(s.type==='scratch_final') right = renderScratchFinal();
  if(s.type==='summary') right = renderSummary();

  slideEl.innerHTML = `
    <div class="kicker">${s.kicker}</div>
    <h2 class="bigTitle">${s.emoji} ${s.title}</h2>
    <p class="subtitle">${s.subtitle}</p>
    <div class="content">
      <div class="card">
        <h3><span class="emoji">${s.emoji}</span>${s.leftTitle}</h3>
        <ul class="bullets">${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      </div>
      ${right}
    </div>`;

  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===slides.length-1;
  renderDots();
  bindInteractions();
}

function bindInteractions(){
  const s = slides[idx];
  if(s.type==='choices'){
    slideEl.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click', e=>{
      if(answered[idx]) return;
      const opt = s.options[Number(e.currentTarget.dataset.opt)];
      const fb = document.getElementById('feedbackBox');
      answered[idx] = true;
      if(opt.correct){
        fb.className='feedback good'; fb.style.display='block'; fb.innerHTML=`✅ ${opt.explain}`;
        addBadge(s.badge); markMission(idx);
      } else {
        fb.className='feedback bad'; fb.style.display='block'; fb.innerHTML=`❌ ${opt.explain}`;
      }
      render();
      const renderedFb = document.getElementById('feedbackBox');
      if(renderedFb){ renderedFb.className = fb.className; renderedFb.style.display='block'; renderedFb.innerHTML = fb.innerHTML; }
    }));
  }
  if(s.type==='mission'){
    slideEl.querySelectorAll('.missionBtn').forEach(btn=>btn.addEventListener('click', e=>{
      if(answered[idx]) return;
      const v = Number(e.currentTarget.dataset.m);
      const fb = document.getElementById('missionFeedback');
      answered[idx] = true;
      if(v===2){ fb.className='feedback good'; fb.innerHTML='✅ Najlepiej: nic nie wysyłać i zapytać dorosłego.'; addBadge(s.badge); markMission(idx); }
      else if(v===1){ fb.className='feedback warn'; fb.innerHTML='🟡 To już całkiem dobrze, ale najlepiej jeszcze powiedzieć dorosłemu.'; addPoint(1); }
      else { fb.className='feedback bad'; fb.innerHTML='❌ Nie wysyłamy takich danych obcym.'; }
      fb.style.display='block';
      slideEl.querySelectorAll('.missionBtn').forEach(b=>b.disabled=true);
    }));
  }
  if(s.type==='memory'){
    slideEl.querySelectorAll('.memoryCard').forEach(btn=>btn.addEventListener('click', e=>{
      const i = Number(e.currentTarget.dataset.card);
      if(memoryState.matched.includes(i) || memoryState.open.includes(i) || memoryState.open.length===2) return;
      memoryState.open.push(i); render();
      if(memoryState.open.length===2){
        const [a,b] = memoryState.open;
        if(shuffledMemory[a].id === shuffledMemory[b].id){
          memoryState.matched.push(a,b); memoryState.open=[]; render();
          if(memoryState.matched.length===shuffledMemory.length){ addBadge(slides[idx].badge); markMission(idx); }
        } else {
          setTimeout(()=>{ memoryState.open=[]; render(); }, 700);
        }
      }
    }));
  }
  if(s.type==='expert'){
    const btn = document.getElementById('expertDone');
    if(btn) btn.addEventListener('click', ()=>{ if(!answered[idx]){ answered[idx]=true; addBadge(s.badge); markMission(idx); btn.textContent='✅ Odznaka przyznana'; btn.disabled=true; } });
  }
  if(s.type==='scratch_final'){
    const draw = document.getElementById('drawScratch');
    const goAiFinal = document.getElementById('goAiFinal');
    const goScratchFinal = document.getElementById('goScratchFinal');
    if(draw) draw.addEventListener('click', openScratchTask);
    if(goAiFinal) goAiFinal.addEventListener('click', ()=>{ window.location.href = 'ai.html'; });
    if(goScratchFinal) goAiFinal && goScratchFinal.addEventListener('click', ()=>{ window.location.href = 'https://scratch.mit.edu/'; });
  }
  if(s.type==='summary'){
    const goAi = document.getElementById('goAi');
    if(goAi) goAi.addEventListener('click', ()=>{ window.location.href = 'ai.html'; });
  }
}

document.getElementById('prev').onclick=()=>{ if(idx>0){ idx--; render(); } };
document.getElementById('next').onclick=()=>{ if(idx<slides.length-1){ idx++; render(); } };
document.getElementById('resetAll').onclick=()=>{
  idx=0; points=0; badges=[]; missionsDone=new Set(); answered={}; memoryState={open:[], matched:[]}; shuffledMemory=[...memoryCards].sort(()=>Math.random()-0.5); updateTop(); render();
};
document.getElementById('fullscreenBtn').onclick=()=>{ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } };
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeScratchTask();
  if(e.key==='ArrowRight' && idx<slides.length-1){idx++;render()}
  if(e.key==='ArrowLeft'&&idx>0){idx--;render()}
});
document.getElementById('scratchClose').onclick = closeScratchTask;
document.getElementById('scratchOverlay').addEventListener('click', (e)=>{ if(e.target.id==='scratchOverlay') closeScratchTask(); });
updateTop(); render();
</script>
</body>
</html>
